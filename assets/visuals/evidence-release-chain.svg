<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1540" viewBox="0 0 960 1540" role="img" aria-labelledby="evidence-release-title evidence-release-desc">
  <title id="evidence-release-title">AEAS evidence and release boundaries</title>
  <desc id="evidence-release-desc">Three visibly separate groups explain AEAS claim discipline, the later public release record, and the current independent-review status. Public claims are tied to evidence classes, sources, and explicit non-claims. The later record documents owner authorization, the signed release commit and signed annotated tag, an immutable GitHub Release with checksums and an artifact-attestation workflow, and a version DOI. Independent review remains not performed. The diagram states that integrity, provenance, and persistence are not correctness; a DOI is not certification or proof of byte equality; and the later publication record is distinct from the v1.0.0 Release and its signed Git objects.</desc>
  <defs>
    <marker id="chain-arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475467"/>
    </marker>
    <marker id="chain-arrow-authority" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9A5B00"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, Arial, sans-serif; fill: #101828; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: 1.2px; }
    .eyebrow { font-size: 15px; font-weight: 600; fill: #5F6B7A; letter-spacing: 1.8px; }
    .page-title { font-size: 34px; font-weight: 600; }
    .page-subtitle { font-size: 19px; fill: #5F6B7A; }
    .group-title { font-size: 25px; font-weight: 600; }
    .group-copy { font-size: 17px; fill: #5F6B7A; }
    .card-label { font-size: 15px; font-weight: 600; fill: #5F6B7A; letter-spacing: 1.1px; }
    .card-title { font-size: 20px; font-weight: 600; }
    .card-copy { font-size: 17px; fill: #475467; }
    .stage-number { font-size: 15px; font-weight: 700; fill: #3548B5; }
    .stage-title { font-size: 18px; font-weight: 600; }
    .stage-copy { font-size: 16px; fill: #5F6B7A; }
    .status { font-size: 21px; font-weight: 700; fill: #B42318; letter-spacing: 1px; }
    .boundary-title { font-size: 16px; font-weight: 600; fill: #B42318; letter-spacing: 1.5px; }
    .boundary-copy { font-size: 17px; fill: #7A271A; }
    .group { fill: #FFFFFF; stroke: #D0D5DD; stroke-width: 1.5; }
    .card { fill: #F9FAFB; stroke: #D0D5DD; stroke-width: 1.5; }
    .claim-card { fill: #EAF1F8; stroke: #264B6B; stroke-width: 1.5; }
    .audit-card { fill: #E7F8FB; stroke: #08798B; stroke-width: 1.5; }
    .authority-card { fill: #FFF3D6; stroke: #9A5B00; stroke-width: 1.5; }
    .release-card { fill: #EDF1FF; stroke: #3548B5; stroke-width: 1.5; }
    .limitation-card { fill: #FFF0EE; stroke: #B42318; stroke-width: 1.5; }
    .flow { fill: none; stroke: #475467; stroke-width: 2; marker-end: url(#chain-arrow-neutral); }
    .authority-flow { fill: none; stroke: #9A5B00; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#chain-arrow-authority); }
  </style>

  <rect width="960" height="1540" fill="#F6F8FB"/>

  <text x="48" y="52" class="eyebrow mono">PUBLIC TECHNICAL RECORD · EVIDENCE BOUNDARIES</text>
  <text x="48" y="98" class="page-title">Claims, release identity,</text>
  <text x="48" y="136" class="page-title">and scrutiny stay distinct</text>
  <text x="48" y="174" class="page-subtitle">Three related assurance surfaces, never one uninterrupted proof chain.</text>

  <!-- A. Claim discipline -->
  <rect x="48" y="208" width="864" height="410" rx="16" class="group"/>
  <text x="76" y="245" class="eyebrow mono" style="fill:#264B6B">A · CLAIM DISCIPLINE</text>
  <text x="76" y="279" class="group-title">Bound every public statement before presenting it</text>

  <rect x="76" y="306" width="370" height="104" rx="12" class="claim-card"/>
  <text x="98" y="335" class="card-label mono" style="fill:#264B6B">PUBLIC STATEMENT</text>
  <text x="98" y="368" class="card-title">Precise claim + stable ID</text>
  <text x="98" y="394" class="card-copy">One attributable proposition</text>

  <path d="M 446 358 L 494 358" class="flow"/>

  <rect x="504" y="306" width="380" height="104" rx="12" class="audit-card"/>
  <text x="526" y="335" class="card-label mono" style="fill:#08798B">QUALIFICATION</text>
  <text x="526" y="368" class="card-title">Evidence class + status</text>
  <text x="526" y="394" class="card-copy">What kind of support is actually present</text>

  <rect x="76" y="428" width="808" height="76" rx="12" class="card"/>
  <text x="98" y="458" class="card-title">Public source + explicit non-claims</text>
  <text x="98" y="486" class="card-copy">Readers can locate the statement and see what it does not establish.</text>

  <rect x="76" y="520" width="808" height="78" rx="10" fill="#EEF1F5" stroke="#98A2B3" stroke-width="1.25"/>
  <text x="98" y="550" class="card-copy"><tspan font-weight="600" fill="#344054">Opaque private baseline commitment:</tspan><tspan xml:space="preserve"> anchors a controlled private manifest.</tspan></text>
  <text x="98" y="578" class="card-copy">It does not provide public access to, or independently validate, the private contents.</text>

  <!-- B. Later public release record -->
  <rect x="48" y="642" width="864" height="438" rx="16" class="group"/>
  <text x="76" y="679" class="eyebrow mono" style="fill:#3548B5">B · LATER PUBLIC RELEASE RECORD</text>
  <text x="76" y="713" class="group-title">Authorization and observed publication are separate facts</text>

  <rect x="76" y="742" width="244" height="226" rx="12" class="authority-card"/>
  <text x="98" y="773" class="card-label mono" style="fill:#9A5B00">HUMAN AUTHORITY</text>
  <text x="98" y="812" class="card-title">Owner release</text>
  <text x="98" y="838" class="card-title">authorization</text>
  <text x="98" y="878" class="card-copy">Version-bound decision</text>
  <text x="98" y="902" class="card-copy">with stated conditions.</text>
  <text x="98" y="944" class="card-copy" style="fill:#9A5B00;font-size:15px;font-weight:600">Approval is not release.</text>

  <path d="M 320 855 L 350 855" class="authority-flow"/>

  <rect x="360" y="742" width="524" height="226" rx="12" class="release-card"/>
  <text x="384" y="773" class="card-label mono" style="fill:#3548B5">OBSERVED PUBLICATION SEQUENCE</text>

  <text x="384" y="811" class="stage-number mono">01</text>
  <text x="428" y="811" class="stage-title">Release commit + annotated tag</text>
  <text x="428" y="834" class="stage-copy">Both Git objects signed; identifiers omitted here</text>
  <line x1="384" y1="852" x2="860" y2="852" stroke="#9BACFF" stroke-width="1"/>

  <text x="384" y="884" class="stage-number mono">02</text>
  <text x="428" y="884" class="stage-title">Immutable GitHub Release</text>
  <text x="428" y="907" class="stage-copy">Checksums + artifact-attestation workflow</text>
  <line x1="384" y1="924" x2="860" y2="924" stroke="#9BACFF" stroke-width="1"/>

  <text x="384" y="953" class="stage-number mono">03</text>
  <text x="428" y="953" class="stage-title">Version DOI · persistent citation for v1.0.0</text>

  <rect x="76" y="986" width="808" height="70" rx="10" fill="#F9FAFB" stroke="#98A2B3" stroke-width="1.25"/>
  <text x="98" y="1014" class="card-copy"><tspan font-weight="600" fill="#344054">v1.0.0 remains unchanged.</tspan></text>
  <text x="98" y="1042" class="card-copy">Observed Release and DOI facts · separate from the signed release commit.</text>

  <!-- C. Independent scrutiny -->
  <rect x="48" y="1104" width="864" height="202" rx="16" class="group"/>
  <text x="76" y="1141" class="eyebrow mono" style="fill:#B42318">C · INDEPENDENT SCRUTINY</text>
  <text x="76" y="1175" class="group-title">External assurance remains a separate future step</text>

  <rect x="76" y="1196" width="264" height="82" rx="12" class="limitation-card"/>
  <text x="98" y="1225" class="card-label mono" style="fill:#B42318">CURRENT STATUS</text>
  <text x="98" y="1256" class="status mono">NOT_PERFORMED</text>

  <rect x="360" y="1196" width="524" height="82" rx="12" class="card"/>
  <text x="384" y="1221" class="card-copy" style="font-size:16px">No external reviewer appointed.</text>
  <text x="384" y="1247" class="card-copy" style="font-size:16px">No independent conclusion issued.</text>
  <text x="384" y="1271" class="card-copy" style="font-size:16px">No external certification claimed.</text>

  <!-- Assurance boundaries -->
  <rect x="48" y="1330" width="864" height="150" rx="16" class="limitation-card"/>
  <text x="76" y="1363" class="boundary-title mono">ASSURANCE BOUNDARIES</text>
  <circle cx="83" cy="1392" r="4" fill="#B42318"/>
  <text x="98" y="1398" class="boundary-copy">Integrity, provenance, and persistence are not correctness.</text>
  <circle cx="83" cy="1422" r="4" fill="#B42318"/>
  <text x="98" y="1428" class="boundary-copy">A DOI is not certification and does not establish byte equality.</text>
  <circle cx="83" cy="1452" r="4" fill="#B42318"/>
  <text x="98" y="1458" class="boundary-copy">Later record ≠ v1.0.0 Release or its signed Git objects.</text>

  <text x="48" y="1516" class="eyebrow mono">AEAS · EVIDENCE &amp; RELEASE</text>
  <text x="912" y="1516" text-anchor="end" class="eyebrow">Ata Nasseri · System Designer and Assurance Owner</text>
</svg>
